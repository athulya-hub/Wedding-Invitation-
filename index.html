<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Wedding Invitation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #171717; }
    body { font-family: Georgia, "Times New Roman", serif; color: #fff; }
    .welcome {
      min-height: 100svh; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; filter: grayscale(100%); z-index: 0;
    }
    .shade {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.55));
    }
    .content { position: relative; z-index: 2; max-width: 520px; }
    .eyebrow {
      font: 12px/1.6 Arial, sans-serif; letter-spacing: .32em;
      text-transform: uppercase; margin-bottom: 16px;
    }
    h1 { font-size: clamp(34px, 8vw, 58px); font-weight: normal; line-height: 1.1; margin: 0 0 28px; }
    .button {
      display: inline-block; padding: 14px 28px; border: 1px solid rgba(255,255,255,.85);
      color: #fff; text-decoration: none; font: 12px/1.2 Arial, sans-serif;
      letter-spacing: .18em; background: rgba(20,20,20,.28);
      transition: background .2s ease, color .2s ease;
    }
    .button:hover, .button:focus { background: #fff; color: #171717; }
    .hint { font: 11px/1.5 Arial, sans-serif; opacity: .82; margin-top: 18px; }
    @media (prefers-reduced-motion: reduce) { video { display: none; } }
  </style>
</head>
<body>
  <main class="welcome">
    <video autoplay muted loop playsinline preload="metadata" aria-label="Wedding welcome video">
      <source src="welcome-video.mp4" type="video/mp4">
    </video>
    <div class="shade"></div>
    <div class="content">
      <div class="eyebrow">You are invited</div>
      <h1>A Celebration<br>of Love</h1>
      <a class="button" href="https://canva.link/fwpc32hlegkow59" target="_blank" rel="noopener">VIEW INVITATION</a>
      <div class="hint">Tap to open the wedding invitation</div>
    </div>
  </main>
</body>
</html>
